<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Indice de Masa Corporal</title>
</head>

<body>
    <nav class="menu">
        <ul>
            <li><a href="index.html">Convertidor de Divisas</a></li>
            <li><a href="index2.html">Calculadora de IMC (Índice de Masa Corporal)</a></li>
        </ul>
    </nav>
    <header>
        <h1>Indice de Masa Corporal</h1>
        <p>Registra los datos que se piden para conocer tu Indice de Masa Corporal</p>
    </header>
    <main class="container">
        <section class="formulario">
            <form id="formu">
                <label for="estatura">Ingrese su estatura:</label>
                <input id="estatura" type="number" placeholder="En metros" step="0.01" required>
                <label for="peso">Ingrese su peso:</label>
                <input id="peso" type="number" placeholder="En kg" step="0.1" required>
                <input id="btn" type="submit" value="Calcular">
            </form>
        </section>
        <section class="resultado">
            <h4>Tu IMC es:</h4>
            <p id="cal"></p>
            <img id="foto" src="" alt="resultado" style="display: none;">
        </section>
    </main>

    <script src="js/miScript2.js"></script>
</body>

</html>
